<!doctype html>
<meta charset="utf-8">
<title>GameHub check</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 24px; max-width: 900px; color: #18202b; background: #f6f7f9; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  button { font: inherit; padding: 6px 12px; cursor: pointer; }
  .state { font-weight: 600; }
  .ok { color: #1f6f5c; } .bad { color: #b3261e; }
  pre { background: #fff; border: 1px solid #d8dde4; padding: 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; }
  iframe { width: 420px; height: 560px; border: 1px solid #d8dde4; background: #fff; }
</style>
<h1>GameHub check</h1>
<div class="row">Extension: <span id="present" class="state">…</span></div>
<div class="row">
  <label>Store <select id="store"><option>steam</option></select></label>
  <button id="hello">hello</button>
  <button id="account">account</button>
  <button id="list">list</button>
  <button id="fresh">list (fresh)</button>
  <button id="signin">Sign in (frame)</button>
  <button id="signout">signOut</button>
</div>
<div class="row" id="frame-row" hidden><iframe id="frame" title="Sign-in"></iframe></div>
<pre id="log"></pre>
<script>
const log = (text, cls) => {
  const line = document.createElement('div');
  line.textContent = new Date().toLocaleTimeString() + '  ' + text;
  if (cls) line.className = cls;
  document.getElementById('log').prepend(line);
};
const present = document.documentElement.dataset.bottlifyGamehub;
const presentEl = document.getElementById('present');
presentEl.textContent = present ? 'found, version ' + present : 'not found (dev build loaded? page reloaded after loading it?)';
presentEl.className = 'state ' + (present ? 'ok' : 'bad');
let lastId = 0;
const ask = (op, args = {}) => new Promise((resolve) => {
  const id = ++lastId; const started = performance.now();
  const timer = setTimeout(() => { removeEventListener('message', heard); resolve({ error: 'no answer in 120 s' }); }, 120000);
  function heard(event) {
    const data = event.data;
    if (event.origin !== location.origin || data?.from !== 'bottlify-gamehub' || data.id !== id) return;
    if (data.event) { log(op + ' event ' + data.event); return; }
    removeEventListener('message', heard); clearTimeout(timer);
    resolve({ ...data, ms: Math.round(performance.now() - started) });
  }
  addEventListener('message', heard);
  postMessage({ to: 'bottlify-gamehub', id, op, args }, location.origin);
});
const store = () => document.getElementById('store').value;
let origin = null;
const show = (op, answer, describe) => {
  if ('error' in answer) log(op + ': ERROR ' + answer.error + ' (' + answer.ms + ' ms)', 'bad');
  else log(op + ': ' + describe(answer.result) + ' (' + answer.ms + ' ms)', 'ok');
};
document.getElementById('hello').onclick = async () => {
  const answer = await ask('hello');
  origin = answer.result?.origin ?? origin;
  show('hello', answer, (r) => JSON.stringify(r));
};
document.getElementById('account').onclick = async () => show('account', await ask('account', { store: store() }),
  (r) => r ? 'signed in as ' + (r.name ?? r.accountName) + ', licences ' + (r.licenses ?? '?') + ', apps ' + (r.apps?.length ?? '?') : 'nobody signed in');
const list = (fresh) => async () => show(fresh ? 'list (fresh)' : 'list', await ask('list', { store: store(), ...(fresh ? { fresh } : {}) }),
  (r) => Array.isArray(r) ? r.length + ' games' + (r[0] ? ', e.g. ' + r.slice(0, 3).map((g) => g.name ?? g.title).join(', ') : '') : JSON.stringify(r));
document.getElementById('list').onclick = list(false);
document.getElementById('fresh').onclick = list(true);
document.getElementById('signout').onclick = async () => {
  show('signOut', await ask('signOut', { store: store() }), () => 'done');
  document.getElementById('frame').src = 'about:blank';
  document.getElementById('frame-row').hidden = true;
};
document.getElementById('signin').onclick = async () => {
  if (!origin) origin = (await ask('hello')).result?.origin;
  if (!origin) { log('sign in: hello gave no extension origin', 'bad'); return; }
  const src = origin + '/' + store() + '/signin.html';
  log('sign in: framing ' + src);
  document.getElementById('frame').src = src;
  document.getElementById('frame-row').hidden = false;
};
addEventListener('message', (event) => {
  if (event.data?.from !== 'bottlify-signin') return;
  if (event.origin !== origin) { log('sign-in message from ' + event.origin + ' ignored', 'bad'); return; }
  log('sign-in frame: signed in as ' + event.data.signedIn?.name, 'ok');
});
</script>
