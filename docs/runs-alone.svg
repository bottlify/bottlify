<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Without cross-origin isolation: one thread runs the program" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Without cross-origin isolation: one thread runs the program</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker></defs><rect width="760" height="560" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Without cross-origin isolation: one thread runs the program</text><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Page main thread</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">launcher, createApp, input, gamepads; starts the engine thread, the log keeper, the AudioWorklet</text><path d="M169 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="177" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · postMessage · OffscreenCanvas</text><path d="M560 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="568" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · addModule</text><rect x="24" y="152" width="344" height="248" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Engine thread</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork: interpreters, region forming,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">translated code</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the program's threads in turn on one core,</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a quantum of 100,000 instructions</text><text x="40" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">program memory: the thread's own</text><text x="40" y="272" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Win32, kernel, files, OPFS, network</text><text x="40" y="288" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">zstd, video, MP3, the sound mixer</text><text x="40" y="304" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Direct3D 10, Vulkan, DirectDraw, GDI,</text><text x="40" y="320" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">presenter → OffscreenCanvas</text><text x="40" y="336" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">records Direct3D 7, 8, 9 and OpenGL calls</text><text x="40" y="352" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">a child process takes its parent's place</text><rect x="400" y="152" width="336" height="104" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="416" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Log keeper</text><text x="416" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">frames, profile, counters</text><text x="416" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the journal comes down a MessageChannel</text><rect x="400" y="280" width="336" height="120" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="416" y="304" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">AudioWorklet</text><text x="416" y="320" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the engine posts it the mix</text><text x="416" y="336" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">down a MessagePort; it plays it</text><text x="416" y="352" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">and says back what it played</text><path d="M368 204H400" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M368 332H400" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M100 400V448" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="108" y="424" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">calls and copied bytes ⇄ frames</text><path d="M300 400V448" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="308" y="424" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">regions ⇄ modules</text><rect x="24" y="448" width="232" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="472" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Graphics thread</text><text x="40" y="488" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Direct3D 7, 8, 9 and OpenGL</text><text x="40" y="504" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">played on its own WebGPU device</text><rect x="272" y="448" width="232" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="288" y="472" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Translation thread</text><text x="288" y="488" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the runtime’s own, one</text><text x="288" y="504" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">region → wasm, batch → module</text><rect x="520" y="448" width="216" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="536" y="472" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Store writer</text><text x="536" y="488" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">translation records</text><text x="536" y="504" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">to OPFS, off the engine</text><path d="M360 400V440H628V448" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/></svg>
