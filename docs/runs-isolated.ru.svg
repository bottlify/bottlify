<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" role="img" aria-label="С cross-origin isolation: процессы и ядра работают одновременно" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>С cross-origin isolation: процессы и ядра работают одновременно</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker></defs><rect width="760" height="900" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">С cross-origin isolation: процессы и ядра работают одновременно</text><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Главный поток страницы</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">лаунчер, createApp; ввод через кольцо в общей памяти; запускает движок, журнал, AudioWorklet</text><path d="M296 104V136" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="304" y="124" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker</text><rect x="24" y="136" width="544" height="136" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="160" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток движка · система</text><text x="40" y="176" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">таблица процессов, реестр, том и бандл,</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">оконный менеджер и фокус, объекты ядра,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">журнал, вывод звука; сеть, fetch, OPFS</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">пул трансляции и его драйвер</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">кода игры не выполняет (concurrency 2 или 4)</text><path d="M168 272V312" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="176" y="296" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · ответы</text><path d="M424 312V272" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="432" y="296" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">вызовы в систему</text><rect x="24" y="312" width="544" height="248" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="336" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Процессы · по воркеру, 2 или 4 сразу</text><rect x="40" y="352" width="256" height="192" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="376" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Процесс A</text><text x="56" y="392" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">своя память в SharedArrayBuffer</text><text x="56" y="408" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">его код выполняет cork</text><text x="56" y="424" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Win32: хэндлы, кучи, модули,</text><text x="56" y="440" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">очереди сообщений</text><text x="56" y="456" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">пишет вызовы Direct3D и OpenGL</text><text x="56" y="472" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">без дела ждёт в Atomics.wait</text><text x="56" y="488" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">потоки на 1..N исполнителях:</text><text x="56" y="504" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">воркер на ядро, кроме первого</text><rect x="312" y="352" width="240" height="192" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="328" y="376" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Процесс B</text><text x="328" y="392" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">лаунчер, установщик,</text><text x="328" y="408" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">вторая программа</text><text x="328" y="424" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">идёт рядом с A так же</text><text x="328" y="440" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">вызовы Win32 с исполнителя</text><text x="328" y="456" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">отвечает поток его процесса</text><path d="M168 560V600" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="176" y="584" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">регионы, вызовы графики, одолженные байты</text><rect x="24" y="600" width="544" height="248" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="624" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Службы</text><rect x="40" y="640" width="248" height="96" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="664" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Пул трансляции ×M</text><text x="56" y="680" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">даётся процессам по нагрузке</text><text x="56" y="696" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">код в общей арене</text><text x="56" y="712" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">каждому процессу один со старта</text><rect x="304" y="640" width="248" height="96" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="320" y="664" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток графики</text><text x="320" y="680" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">вся графика на своём WebGPU</text><text x="320" y="696" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">байты unlock читает на месте</text><text x="320" y="712" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">всегда один</text><rect x="40" y="744" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="768" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Журнал и AudioWorklet</text><text x="56" y="784" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">читают кольцо журнала и</text><text x="56" y="800" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">таблицу голосов в общей памяти</text><text x="56" y="816" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">запускает страница</text><rect x="304" y="744" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="320" y="768" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Писатель хранилища</text><text x="320" y="784" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">записи переводов в OPFS</text><text x="320" y="800" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">его читают все исполнители</text><rect x="584" y="136" width="152" height="712" rx="8" fill="#EEEDE8" stroke="#C4C2B8" stroke-width="1.25"/><text x="600" y="160" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Общая память</text><text x="600" y="176" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">SharedArrayBuffer:</text><text x="600" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">память процессов</text><text x="600" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">связи: кольца</text><text x="600" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">система ⇄ процесс</text><text x="600" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">каналы ядер</text><text x="600" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">таблицы cork и</text><text x="600" y="272" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">арена кода</text><text x="600" y="288" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">кольцо журнала</text><text x="600" y="304" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">таблица голосов</text><text x="600" y="320" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">кольцо ввода</text><path d="M568 204H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M568 448H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M568 688H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M568 788H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="24" y="876" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">concurrency 1: игра идёт в самом потоке движка, но так же с ядрами, пулом и общей памятью.</text></svg>
