<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Без cross-origin isolation: программу ведёт один поток" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Без cross-origin isolation: программу ведёт один поток</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker></defs><rect width="760" height="560" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Без cross-origin isolation: программу ведёт один поток</text><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Главный поток страницы</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">лаунчер, createApp, ввод, геймпады; запускает поток движка, хранителя журнала, AudioWorklet</text><path d="M169 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="177" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · postMessage · OffscreenCanvas</text><path d="M560 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="568" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · addModule</text><rect x="24" y="152" width="344" height="248" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток движка</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork: интерпретаторы, сборка регионов,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">переведённый код</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">потоки игры по очереди на одном ядре,</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">квант 100 000 инструкций</text><text x="40" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">память игры: собственная память потока</text><text x="40" y="272" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Win32, ядро, файлы, OPFS, сеть</text><text x="40" y="288" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">zstd, видео, MP3, микшер звука</text><text x="40" y="304" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Direct3D 10, Vulkan, DirectDraw, GDI,</text><text x="40" y="320" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">презентер → OffscreenCanvas</text><text x="40" y="336" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">записывает вызовы Direct3D 7, 8, 9 и OpenGL</text><text x="40" y="352" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">дочерний процесс встаёт на место родителя</text><rect x="400" y="152" width="336" height="104" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="416" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Хранитель журнала</text><text x="416" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">кадры, профиль, счётчики</text><text x="416" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">журнал приходит по MessageChannel</text><rect x="400" y="280" width="336" height="120" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="416" y="304" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">AudioWorklet</text><text x="416" y="320" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">движок присылает ему микс</text><text x="416" y="336" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">по MessagePort; он его играет</text><text x="416" y="352" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">и сообщает, что проиграл</text><path d="M368 204H400" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M368 332H400" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M100 400V448" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="108" y="424" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">вызовы и копии байтов ⇄ кадры</text><path d="M300 400V448" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="308" y="424" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">регионы ⇄ модули</text><rect x="24" y="448" width="232" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="472" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток графики</text><text x="40" y="488" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Direct3D 7, 8, 9 и OpenGL</text><text x="40" y="504" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">на своём устройстве WebGPU</text><rect x="272" y="448" width="232" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="288" y="472" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток трансляции</text><text x="288" y="488" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">собственный у рантайма, один</text><text x="288" y="504" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">регион → wasm, пакет → модуль</text><rect x="520" y="448" width="216" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="536" y="472" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Писатель хранилища</text><text x="536" y="488" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">записи переводов</text><text x="536" y="504" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">в OPFS, вне потока движка</text><path d="M360 400V440H628V448" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/></svg>
