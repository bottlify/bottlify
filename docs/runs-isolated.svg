<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" role="img" aria-label="With cross-origin isolation: processes and cores run at once" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>With cross-origin isolation: processes and cores run at once</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker></defs><rect width="760" height="900" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">With cross-origin isolation: processes and cores run at once</text><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Page main thread</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">launcher, createApp; input through a ring in shared memory; starts engine, log keeper, AudioWorklet</text><path d="M296 104V136" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="304" y="124" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker</text><rect x="24" y="136" width="544" height="136" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="160" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Engine thread · the system</text><text x="40" y="176" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">process table, registry, volume and bundle,</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">window manager and focus, named kernel objects,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">journal, sound output; network, fetch, OPFS</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the translation pool and its driver</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">runs no program code (concurrency 2 or 4)</text><path d="M168 272V312" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="176" y="296" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · answers</text><path d="M424 312V272" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="432" y="296" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">calls into the system</text><rect x="24" y="312" width="544" height="248" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="336" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Processes · one worker each, 2 or 4 at once</text><rect x="40" y="352" width="256" height="192" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="376" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Process A</text><text x="56" y="392" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">own memory, a SharedArrayBuffer</text><text x="56" y="408" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork runs its code</text><text x="56" y="424" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Win32: handles, heaps, modules,</text><text x="56" y="440" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">message queues</text><text x="56" y="456" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">records Direct3D and OpenGL calls</text><text x="56" y="472" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">waits on Atomics.wait when idle</text><text x="56" y="488" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">threads on 1..N executors:</text><text x="56" y="504" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">a worker per core past the first</text><rect x="312" y="352" width="240" height="192" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="328" y="376" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Process B</text><text x="328" y="392" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a launcher, an installer,</text><text x="328" y="408" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a second program</text><text x="328" y="424" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">runs beside A, the same way</text><text x="328" y="440" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">an executor's call into Win32</text><text x="328" y="456" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">is answered by its process</text><path d="M168 560V600" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><text x="176" y="584" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">regions, graphics calls, lent bytes</text><rect x="24" y="600" width="544" height="248" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="624" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Services</text><rect x="40" y="640" width="248" height="96" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="664" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Translation pool ×M</text><text x="56" y="680" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">lent to the processes by load</text><text x="56" y="696" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">emitted code in a shared arena</text><text x="56" y="712" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">one per process from its start</text><rect x="304" y="640" width="248" height="96" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="320" y="664" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Graphics thread</text><text x="320" y="680" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">all graphics on its own WebGPU</text><text x="320" y="696" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">reads unlocked bytes in place</text><text x="320" y="712" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">always 1</text><rect x="40" y="744" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="768" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Log keeper and AudioWorklet</text><text x="56" y="784" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">read the journal ring and</text><text x="56" y="800" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the voice table in shared memory</text><text x="56" y="816" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">started by the page</text><rect x="304" y="744" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="320" y="768" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Store writer</text><text x="320" y="784" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">translation records to OPFS</text><text x="320" y="800" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">every executor reads the store</text><rect x="584" y="136" width="152" height="712" rx="8" fill="#EEEDE8" stroke="#C4C2B8" stroke-width="1.25"/><text x="600" y="160" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Shared memory</text><text x="600" y="176" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">SharedArrayBuffer:</text><text x="600" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">process memory</text><text x="600" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">links: system ⇄</text><text x="600" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">process rings</text><text x="600" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">executor channels</text><text x="600" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork tables and</text><text x="600" y="272" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the code arena</text><text x="600" y="288" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">journal ring</text><text x="600" y="304" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">voice table</text><text x="600" y="320" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">input ring</text><path d="M568 204H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M568 448H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M568 688H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M568 788H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="24" y="876" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">Concurrency 1: the program runs on the engine thread itself, still with cores, pool and shared memory.</text></svg>
