<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bottlify</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #16181d;
        --panel: #1e2128;
        --line: #2c313b;
        --text: #d7dae0;
        --dim: #8b929e;
        --accent: #6aa9ff;
        --ok: #63c98a;
        --bad: #e8737d;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
    }
    header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0 auto 0 0; letter-spacing: .02em; }
    button, label.file {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
    }
    button:hover, label.file:hover { border-color: var(--accent); }
    button[disabled] { opacity: .45; cursor: default; border-color: var(--line); }
    input[type=file] { display: none; }

    main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
    section { background: var(--bg); padding: 16px 20px; min-height: calc(100vh - 106px); }
    h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--dim);
        margin: 0 0 10px;
        font-weight: 600;
    }
    pre {
        margin: 0;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
    }
    #status { padding: 10px 20px; border-bottom: 1px solid var(--line); color: var(--dim); }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }

    .module { border-top: 1px solid var(--line); padding: 8px 0; }
    .module:first-child { border-top: 0; }
    .module-head { display: flex; gap: 8px; align-items: baseline; }
    .name { font-weight: 600; }
    .badge { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
    .badge.ready { color: var(--ok); border-color: var(--ok); }
    .badge.stub { color: var(--dim); }
    .metrics {
        margin: 6px 0 0;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
        color: var(--dim);
    }
    .metrics b { color: var(--text); font-weight: 500; }
    .empty { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<header>
    <h1>Bottlify</h1>
    <button id="run">Run hello.exe</button>
    <label class="file">Open PE&hellip;<input id="file" type="file" /></label>
</header>

<p id="status">Idle.</p>

<main>
    <section>
        <h2>Guest output</h2>
        <pre id="output" class="empty">nothing yet</pre>
    </section>
    <section>
        <h2>Diagnostics</h2>
        <div id="diagnostics" class="empty">nothing yet</div>
    </section>
</main>

<script type="module" src="./main.js"></script>
</body>
</html>
