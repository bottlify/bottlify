name: publish

# By hand only, from main once its ci run is green: every package packed, the
# tarballs kept as the run's artifacts, and the packages named staged on npm.
# No token: npm trusts this workflow of this repository (trusted publishing,
# set per package on npmjs.com, which allows it to stage only), and the job
# proves who it is with its OIDC token. A staged version goes live once a
# maintainer approves it with 2FA (npmjs.com, or
# `npm stage approve <id> --otp <code>`). npm refuses a version already
# published, so a version is raised in its package.json first.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish, by short name: core, cork, installer, networking'
        required: true
        default: 'core,cork,installer,networking'

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: pack every package, publish the ones named
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 12, whose `npm stage` this needs, runs on Node 24.15 and later.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.0
      - run: npm ci
      # The core package carries the video decoder where it can be had; the
      # package check holds it to its size when it is there.
      # A release of this repository, which is private: fetched through the API
      # with the job's token, as in ci.
      - run: npm run fetch:video-decoder
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Packing runs no prepublishOnly: the core package's dist is built here,
      # and its check run, before anything is packed or published.
      - run: npm run build -w @bottlify/core
      - run: npm run check:package -w @bottlify/core
      # npmjs.com resolves a README's relative links against the repository's
      # root; each package's README is given links to this commit instead.
      - run: node tools/readme-links.mjs "$GITHUB_SHA" modules/core modules/cork modules/installer modules/networking
      - name: pack
        run: |
          mkdir -p packs
          npm pack -w @bottlify/core -w @bottlify/cork -w @bottlify/installer -w @bottlify/networking --pack-destination packs
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packs/*.tgz
      - name: stage
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          for name in $(echo "$PACKAGES" | tr ',' ' '); do
            npm stage publish -w "@bottlify/$name" --access public
          done
          # Listing needs a maintainer's login, which the job does not have.
