name: ci

# A push to a branch with an open pull request would otherwise run this twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (typecheck, tests, boundaries, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run check:boundaries
      # Integration tests drive a real v86 build, fetched from our fork's release.
      - run: npm run fetch:v86
      # The build refuses to make a package that cannot boot, so the decoder has
      # to be here too -- and the release test packs and installs the result.
      # It is a release of this repository, which is private: the plain download
      # URL answers 404, so the fetch goes through the API with the job's token.
      - run: npm run fetch:video-decoder
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:integration
      - run: npm run build

  probe:
    name: probe (browser → worker ping → screenshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      # Asked of the action rather than assumed: where it puts the browser is
      # its business and has moved before, and a wrong path here fails inside
      # the probe rather than at the step that owns it.
      - run: npm run cdp:probe
        env:
          CDP_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}