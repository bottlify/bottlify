name: ci

# Once a day, and only when main took commits in the day before, or when asked
# for by hand. The repository is private, so its minutes are metered, and a run
# on every push -- dozens a day, each across two jobs -- spent them all. What
# goes to main is judged by the whole set run locally first (CLAUDE.md, Tests);
# this is the same set on a clean machine, a day behind at most.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A run asked for by hand while another is going replaces it.
concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  changed:
    name: changed (commits to main in the last day)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commits: ${{ steps.since.outputs.commits }}
    steps:
      # Asked of the API, not of a checkout: the answer is a number and a clone
      # of this history would cost more than the question is worth.
      - id: since
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "commits=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since&per_page=1" --jq length)"
          echo "commits=$count" >> "$GITHUB_OUTPUT"
          echo "commits to main since $since: $count"

  core:
    name: core (typecheck, tests, boundaries, build)
    needs: changed
    if: needs.changed.outputs.commits != '0'
    runs-on: ubuntu-latest
    # About a quarter of an hour when it goes well; a hung run would otherwise
    # be paid for until the platform's six hours end.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run check:boundaries
      # The release test packs and installs the built package, decoder included.
      # It is a release of this repository, which is private: the plain download
      # URL answers 404, so the fetch goes through the API with the job's token.
      - run: npm run fetch:video-decoder
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The translator's corpus suites judge it against the hardware recording;
      # with CI set they fail rather than skip without it.
      - run: npm run fetch:corpus
      - run: npm run test:integration
      - run: npm run build

  probe:
    name: probe (browser → worker ping → screenshot)
    needs: changed
    if: needs.changed.outputs.commits != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      # Asked of the action rather than assumed: where it puts the browser is
      # its business and has moved before, and a wrong path here fails inside
      # the probe rather than at the step that owns it.
      - run: npm run cdp:probe
        env:
          CDP_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # Random shaders through the reference machine and through WGSL on the GPU.
      - run: npm run cdp:shaders
        env:
          CDP_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}