<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 632" width="760" height="632" role="img" aria-label="Бутылки сейчас: делает сервер, меняются только записями" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Бутылки сейчас: делает сервер, меняются только записями</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker><marker id="arrowx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker></defs><rect width="760" height="632" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Бутылки сейчас: делает сервер, меняются только записями</text><path d="M196 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M368 220H392" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M564 288V308H196V328" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M368 404H392" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Страница: лаунчер</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">библиотека с сервера; на бутылку: версия Windows, графика, текстовые файлы поверх C:\App</text><rect x="24" y="152" width="344" height="136" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Воркер движка: инсталлятор</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">сбор: файлы под выбранным корнем,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">добавки в system32, реестр</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">упаковка: блоки, затем части</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">точка входа угадывается: самый</text><text x="40" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">большой exe, не setup и не launcher</text><rect x="392" y="152" width="344" height="136" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="408" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Сервер бутылок</text><text x="408" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">пишет &lt;id&gt;/bundle.btl и manifest.json:</text><text x="408" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">id, title, entry, root, windows, graphics,</text><text x="408" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">bundle; commandLine и network.allow —</text><text x="408" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">если вписать руками</text><text x="408" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">index.json: папки, которые у него есть</text><rect x="24" y="328" width="344" height="152" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="352" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Воркер движка: бутылка</text><text x="40" y="368" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">бандл только для чтения на C:\App, по URL</text><text x="40" y="384" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">или из Blob на устройстве (новое)</text><text x="40" y="400" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">записи поверх, в памяти</text><text x="40" y="416" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">командная строка: "entry" + commandLine</text><text x="40" y="432" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">рабочая папка: папка точки входа</text><rect x="392" y="328" width="344" height="152" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="408" y="352" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">OPFS</text><text x="408" y="368" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;.blocks: уже скачанные блоки</text><text x="408" y="384" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;.files/: что записала программа,</text><text x="408" y="400" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">по записи на файл, по мере изменений</text><text x="408" y="416" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork/&lt;id&gt;.v3: переводы</text><rect x="24" y="504" width="712" height="80" rx="8" fill="#C2410C" fill-opacity="0.06" stroke="#C2410C" stroke-width="1.25" stroke-dasharray="5 4"/><text x="40" y="528" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Нет</text><text x="40" y="544" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">бутылки, упакованной и хранимой на устройстве · записей бутылки, ставших новой бутылкой · общей библиотеки</text><text x="40" y="560" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">редактора: точки входа, аргументы, рабочая папка, режим, сеть · запуска серверной бутылки без сети</text><text x="204" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">прогон инсталлятора</text><text x="380" y="210" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="middle">POST</text><text x="204" y="322" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">блоки по HTTP Range</text><rect x="24" y="601" width="22" height="14" rx="3" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="54" y="612" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">выполняет программу</text><rect x="199.8" y="601" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="229.8" y="612" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">работает сейчас</text><rect x="350.8" y="601" width="22" height="14" rx="3" fill="#C2410C" fill-opacity="0.06" stroke="#C2410C" stroke-width="1.25" stroke-dasharray="5 4"/><text x="380.8" y="612" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">нет</text></svg>