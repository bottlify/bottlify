<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 624" width="760" height="624" role="img" aria-label="Бутылки цель: всё на устройстве, сервер — чтобы делиться" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Бутылки цель: всё на устройстве, сервер — чтобы делиться</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker><marker id="arrowx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker></defs><rect width="760" height="624" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Бутылки цель: всё на устройстве, сервер — чтобы делиться</text><path d="M196 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M368 220H392" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M564 288V328" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M392 388H368" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M564 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Страница: лаунчер</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">библиотека и редактор; бутылка на устройстве стартует вообще без сети</text><rect x="24" y="152" width="344" height="136" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Воркер движка</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">любая программа в бутылке: инсталлятор,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Steam, утилита, игра</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">режим и сеть — какие просит точка входа</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">большие записи — прямо в OPFS</text><rect x="392" y="152" width="344" height="136" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="408" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">OPFS: бутылки на устройстве</text><text x="408" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;/bundle.btl, &lt;id&gt;/manifest.json</text><text x="408" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;.files/: записи с последнего сохранения</text><text x="408" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;.blocks: серверные бутылки, для офлайна</text><text x="408" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">navigator.storage.persist() — один раз</text><rect x="24" y="328" width="344" height="120" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="352" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Сервер бутылок</text><text x="40" y="368" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">получает бутылку, когда человек</text><text x="40" y="384" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">ею делится; отдаёт её по URL другим,</text><text x="40" y="400" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">как сейчас</text><rect x="392" y="328" width="344" height="120" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="408" y="352" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Воркер упаковки</text><text x="408" y="368" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">packBundle с приёмником в OPFS</text><text x="408" y="384" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">индекс, заголовок и манифест пишутся здесь</text><text x="408" y="400" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">база + записи → следующая версия</text><text x="408" y="416" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">поток движка его никогда не ждёт</text><rect x="24" y="472" width="712" height="96" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="40" y="496" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Редактор бутылки</text><text x="40" y="512" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">точки входа: имя, exe, аргументы, рабочая папка, режим, разрешённая сеть; одна — по умолчанию</text><text x="40" y="528" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">запустить в бутылке что угодно — инсталлятор, Steam, утилиту — и сделать установленное точкой входа</text><text x="40" y="544" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">сохранить: записи становятся следующей версией; имя, обложка; выгрузка и загрузка файла .btl</text><text x="204" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">bundle: { file }</text><text x="572" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">библиотека: устройство + сервер</text><text x="572" y="314" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">читает базу + записи, пишет .btl</text><rect x="24" y="593" width="22" height="14" rx="3" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="54" y="604" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">выполняет программу</text><rect x="199.8" y="593" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="229.8" y="604" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">работает сейчас</text><rect x="350.8" y="593" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="380.8" y="604" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">построить</text></svg>