<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 624" width="760" height="624" role="img" aria-label="Bottles target: made, kept, changed and started on the device; the server is for sharing" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Bottles target: made, kept, changed and started on the device; the server is for sharing</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker><marker id="arrowx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker></defs><rect width="760" height="624" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Bottles target: made, kept, changed and started on the device; the server is for sharing</text><path d="M196 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M368 220H392" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M564 288V328" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M392 388H368" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M564 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Page: the launcher</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">the library and the editor; a bottle on the device starts with no network at all</text><rect x="24" y="152" width="344" height="136" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Engine worker</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">any program in the bottle: an installer,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Steam, a tool, the game</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the mode and network its entry asks for</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">large writes go straight to OPFS</text><rect x="392" y="152" width="344" height="136" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="408" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">OPFS: bottles on the device</text><text x="408" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;/bundle.btl, &lt;id&gt;/manifest.json</text><text x="408" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;.files/: writes since the last save</text><text x="408" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;.blocks: server bottles, for offline</text><text x="408" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">navigator.storage.persist() asked once</text><rect x="24" y="328" width="344" height="120" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="352" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Bottle server</text><text x="40" y="368" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">receives a bottle when the person</text><text x="40" y="384" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">shares it; serves it by URL to others</text><text x="40" y="400" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">as today</text><rect x="392" y="328" width="344" height="120" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="408" y="352" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Packing worker</text><text x="408" y="368" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">packBundle with an OPFS sink</text><text x="408" y="384" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the index, header and manifest written here</text><text x="408" y="400" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">base + writes → the next version</text><text x="408" y="416" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the engine thread never waits on it</text><rect x="24" y="472" width="712" height="96" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="40" y="496" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Bottle editor</text><text x="40" y="512" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">entries: name, exe, arguments, working directory, mode, network allow; one is the default</text><text x="40" y="528" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">run any program in the bottle -- an installer, Steam, a tool -- and make what it installed an entry</text><text x="40" y="544" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">save: the writes become the bottle's next version; rename, cover; export and import a .btl file</text><text x="204" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">bundle: { file }</text><text x="572" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">library: device + server</text><text x="572" y="314" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">reads base + writes, writes .btl</text><rect x="24" y="593" width="22" height="14" rx="3" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="54" y="604" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">runs a program</text><rect x="168.8" y="593" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="198.8" y="604" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">works today</text><rect x="295" y="593" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="325" y="604" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">to build</text></svg>