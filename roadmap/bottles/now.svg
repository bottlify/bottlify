<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 632" width="760" height="632" role="img" aria-label="Bottles today: made on the server, started from it, changed only by its writes" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Bottles today: made on the server, started from it, changed only by its writes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker><marker id="arrowx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker></defs><rect width="760" height="632" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Bottles today: made on the server, started from it, changed only by its writes</text><path d="M196 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M368 220H392" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M564 288V308H196V328" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M368 404H392" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Page: the launcher</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">a library from the server; per bottle: Windows version, graphics, text files over C:\App</text><rect x="24" y="152" width="344" height="136" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Engine worker: an installer</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">collect: the files under the chosen root,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">system32 additions, the registry</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">pack: blocks, then parts</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">entry guessed: the largest exe</text><text x="40" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">that is not a setup or launcher</text><rect x="392" y="152" width="344" height="136" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="408" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Bottle server</text><text x="408" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">writes &lt;id&gt;/bundle.btl and manifest.json:</text><text x="408" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">id, title, entry, root, windows, graphics,</text><text x="408" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">bundle; commandLine and network.allow</text><text x="408" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">when written by hand</text><text x="408" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">index.json: the folders it holds</text><rect x="24" y="328" width="344" height="152" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="352" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Engine worker: a bottle</text><text x="40" y="368" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the bundle read-only on C:\App, by URL</text><text x="40" y="384" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">or from a Blob on the device (new)</text><text x="40" y="400" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">its writes over it, in memory</text><text x="40" y="416" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">command line: "entry" + commandLine</text><text x="40" y="432" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">working directory: the entry's folder</text><rect x="392" y="328" width="344" height="152" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="408" y="352" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">OPFS</text><text x="408" y="368" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;.blocks: blocks already fetched</text><text x="408" y="384" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">&lt;id&gt;.files/: what the program wrote,</text><text x="408" y="400" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a file to an entry, saved as it changes</text><text x="408" y="416" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork/&lt;id&gt;.v3: translations</text><rect x="24" y="504" width="712" height="80" rx="8" fill="#C2410C" fill-opacity="0.06" stroke="#C2410C" stroke-width="1.25" stroke-dasharray="5 4"/><text x="40" y="528" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Missing</text><text x="40" y="544" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a bottle packed and kept on the device · a bottle's writes made into a new bottle · one library of both kinds</text><text x="40" y="560" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">an editor: entries, arguments, working directory, mode, network · a server bottle started offline</text><text x="204" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">installer run</text><text x="380" y="210" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="middle">POST</text><text x="204" y="322" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">blocks by HTTP Range</text><rect x="24" y="601" width="22" height="14" rx="3" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="54" y="612" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">runs the program</text><rect x="181.2" y="601" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="211.2" y="612" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">works today</text><rect x="307.4" y="601" width="22" height="14" rx="3" fill="#C2410C" fill-opacity="0.06" stroke="#C2410C" stroke-width="1.25" stroke-dasharray="5 4"/><text x="337.4" y="612" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">missing</text></svg>