<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 704" width="760" height="704" role="img" aria-label="Steam цель: вход, загрузка в бутылку, смена точки входа, игра" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Steam цель: вход, загрузка в бутылку, смена точки входа, игра</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker><marker id="arrowx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker></defs><rect width="760" height="704" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Steam цель: вход, загрузка в бутылку, смена точки входа, игра</text><path d="M200 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M444 200H476" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M606 256V280" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M200 352V392" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M476 448H444" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M200 504V544" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Страница: лаунчер и редактор бутылок</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">одна библиотека бутылок, на сервере и на устройстве, у каждой точки входа, аргументы и режим</text><rect x="24" y="152" width="420" height="200" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Воркер движка: SteamCMD</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">steamcmd.exe +login … +app_update &lt;appid&gt; +quit</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">нужные ему импорты: WSASocketA, WSASendTo,</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">WSARecvFrom, GetDiskFreeSpaceExW, IsUserAnAdmin,</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Set/GetDlgItemInt, SHGetFileInfoW</text><text x="40" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">консоль, в которую человек вводит пароль и Steam Guard</text><text x="40" y="272" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">слой записи пишет большие файлы прямо в OPFS,</text><text x="40" y="288" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">а не держит их в памяти</text><text x="40" y="304" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">вход хранится в бутылке, как его хранит Steam</text><rect x="476" y="152" width="260" height="104" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="492" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Релей /relay</text><text x="492" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">в сервере лаунчера, тот же origin</text><text x="492" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">бутылка разрешает хосты Steam</text><text x="492" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">труба для байтов: TLS кончается в госте</text><rect x="476" y="280" width="260" height="72" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="492" y="304" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Steam</text><text x="492" y="320" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">вход, депо</text><rect x="24" y="392" width="420" height="112" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="40" y="416" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Бутылка на устройстве (OPFS)</text><text x="40" y="432" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">пакуется в воркере: база + записи → &lt;id&gt;.btl</text><text x="40" y="448" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">манифест: точки входа (Steam, игра), аргументы,</text><text x="40" y="464" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">рабочая папка, режим, сеть; сервер не участвует</text><text x="40" y="480" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">на сервер — только когда человек делится</text><rect x="476" y="392" width="260" height="112" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="492" y="416" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Редактор бутылки</text><text x="492" y="432" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">точки входа из конфигурации</text><text x="492" y="448" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">запуска приложения (app_info_print)</text><text x="492" y="464" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">или выбранные руками;</text><text x="492" y="480" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">запуск любой программы в бутылке</text><rect x="24" y="544" width="420" height="96" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="568" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Воркер движка: игра</text><text x="40" y="584" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">точка входа: exe игры с его аргументами</text><text x="40" y="600" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">режим: auto, isolated там, где страница изолирована</text><text x="40" y="616" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">игра, которой не нужен Steam, работает сама</text><rect x="476" y="544" width="260" height="96" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="492" y="568" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Игры на Steamworks</text><text x="492" y="584" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">клиент Steam рядом с игрой:</text><text x="492" y="600" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">64 бита — этап 4 v2; рядом —</text><text x="492" y="616" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">этап 2 v2</text><text x="208" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · режима compatible достаточно</text><text x="460" y="190" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="middle">WS</text><text x="208" y="378" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">файлы, по мере записи</text><text x="208" y="530" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">игра, из новой бутылки</text><rect x="24" y="673" width="22" height="14" rx="3" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="54" y="684" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">выполняет программу</text><rect x="199.8" y="673" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="229.8" y="684" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">работает сейчас</text><rect x="350.8" y="673" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="380.8" y="684" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">построить</text></svg>