<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="Steam сейчас: SteamCMD встаёт на первом недостающем импорте" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Steam сейчас: SteamCMD встаёт на первом недостающем импорте</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker><marker id="arrowx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker></defs><rect width="760" height="600" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Steam сейчас: SteamCMD встаёт на первом недостающем импорте</text><path d="M200 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M444 200H476" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M606 256V296" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M200 400V440" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Страница: лаунчер</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">бутылки на сервере (/bundles/index.json); стартует по URL, entry и commandLine заданы раз и навсегда</text><rect x="24" y="152" width="420" height="248" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Воркер движка</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork выполняет steamcmd.exe, 32-битную программу</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">wsock32, ws2_32: socket, connect, send, recv, select,</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">WSAEventSelect, WSASend, WSARecv, DNS через релей</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">wininet поверх транспорта, который ему дадут</text><text x="40" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">слой записи: в памяти, сохраняется в OPFS</text><text x="40" y="272" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">по файлу после того, как программа пишет</text><rect x="40" y="280" width="388" height="104" rx="8" fill="#C2410C" fill-opacity="0.06" stroke="#C2410C" stroke-width="1.25" stroke-dasharray="5 4"/><text x="56" y="304" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Встаёт на SHELL32 #680 (IsUserAnAdmin)</text><text x="56" y="320" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">и ещё не получает: WSASocketA, WSASendTo,</text><text x="56" y="336" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">WSARecvFrom, GetDiskFreeSpaceExW,</text><text x="56" y="352" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">SetDlgItemInt, GetDlgItemInt, SHGetFileInfoW</text><rect x="476" y="152" width="260" height="104" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="492" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Релей /relay</text><text x="492" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">в сервере лаунчера, тот же origin</text><text x="492" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">TCP, UDP, DNS к хостам из</text><text x="492" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">network.allow бутылки или RELAY_ALLOW</text><rect x="476" y="296" width="260" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="492" y="320" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Steam</text><text x="492" y="336" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">connection managers: вход</text><text x="492" y="352" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">серверы контента: депо</text><rect x="24" y="440" width="420" height="104" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="464" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Сервер бутылок</text><text x="40" y="480" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">прогон инсталлятора собирается, пакуется и грузится;</text><text x="40" y="496" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">сервер пишет .btl, его индекс и manifest.json --</text><text x="40" y="512" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">единственное место, где делается бутылка</text><rect x="476" y="440" width="260" height="104" rx="8" fill="#C2410C" fill-opacity="0.06" stroke="#C2410C" stroke-width="1.25" stroke-dasharray="5 4"/><text x="492" y="464" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Чего ещё нет</text><text x="492" y="480" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">бутылки, сделанной на устройстве</text><text x="492" y="496" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">редактора: точки входа, аргументы, режим</text><text x="492" y="512" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">клиента Steam, 64-битного с 2025</text><text x="208" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · бандл по URL</text><text x="460" y="190" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="middle">WS</text><text x="614" y="280" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">TCP, UDP</text><text x="208" y="426" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">упакованные части, POST</text><rect x="24" y="569" width="22" height="14" rx="3" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="54" y="580" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">выполняет программу</text><rect x="199.8" y="569" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="229.8" y="580" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">работает сейчас</text><rect x="350.8" y="569" width="22" height="14" rx="3" fill="#C2410C" fill-opacity="0.06" stroke="#C2410C" stroke-width="1.25" stroke-dasharray="5 4"/><text x="380.8" y="580" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">нет</text></svg>