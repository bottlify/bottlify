<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 704" width="760" height="704" role="img" aria-label="Steam target: sign in, download into a bottle on the device, switch its entry, play" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Steam target: sign in, download into a bottle on the device, switch its entry, play</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker><marker id="arrowx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker></defs><rect width="760" height="704" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Steam target: sign in, download into a bottle on the device, switch its entry, play</text><path d="M200 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M444 200H476" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M606 256V280" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M200 352V392" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M476 448H444" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M200 504V544" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Page: the launcher and the bottle editor</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">one library of bottles, on the server and on the device, each with its entries, arguments and mode</text><rect x="24" y="152" width="420" height="200" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Engine worker: SteamCMD</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">steamcmd.exe +login … +app_update &lt;appid&gt; +quit</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the imports it needs: WSASocketA, WSASendTo,</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">WSARecvFrom, GetDiskFreeSpaceExW, IsUserAnAdmin,</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Set/GetDlgItemInt, SHGetFileInfoW</text><text x="40" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a console the person types into: password, Steam Guard</text><text x="40" y="272" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the writable layer streams large files into OPFS</text><text x="40" y="288" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">rather than holding them in memory</text><text x="40" y="304" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the sign-in kept in the bottle, as Steam keeps it</text><rect x="476" y="152" width="260" height="104" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="492" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Relay /relay</text><text x="492" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">in the launcher server, same origin</text><text x="492" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the bottle allows Steam's hosts</text><text x="492" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a byte pipe: TLS ends in the guest</text><rect x="476" y="280" width="260" height="72" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="492" y="304" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Steam</text><text x="492" y="320" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">sign-in, depots</text><rect x="24" y="392" width="420" height="112" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="40" y="416" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">A bottle on the device (OPFS)</text><text x="40" y="432" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">packed in a worker: base + writes → &lt;id&gt;.btl</text><text x="40" y="448" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">manifest: entries (Steam, the game), arguments,</text><text x="40" y="464" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">working directory, mode, network; no server involved</text><text x="40" y="480" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">uploaded only when the person shares it</text><rect x="476" y="392" width="260" height="112" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="492" y="416" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Bottle editor</text><text x="492" y="432" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">entries from the app's own launch</text><text x="492" y="448" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">config (app_info_print),</text><text x="492" y="464" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">or chosen by hand;</text><text x="492" y="480" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">run any program in the bottle</text><rect x="24" y="544" width="420" height="96" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="568" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Engine worker: the game</text><text x="40" y="584" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">entry: the game's exe with its arguments</text><text x="40" y="600" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">mode: auto, full where the page is isolated</text><text x="40" y="616" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a game that does not need Steam runs on its own</text><rect x="476" y="544" width="260" height="96" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="492" y="568" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Steamworks titles</text><text x="492" y="584" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the Steam client beside the game:</text><text x="492" y="600" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">64-bit, so v2 stage 4; side by side,</text><text x="492" y="616" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">so v2 stage 2</text><text x="208" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · mode: safe is enough</text><text x="460" y="190" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="middle">WS</text><text x="208" y="378" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">files, as they are written</text><text x="208" y="530" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">the game, from the new bottle</text><rect x="24" y="673" width="22" height="14" rx="3" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="54" y="684" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">runs a program</text><rect x="168.8" y="673" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="198.8" y="684" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">works today</text><rect x="295" y="673" width="22" height="14" rx="3" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="325" y="684" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">to build</text></svg>