<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 848" width="760" height="848" role="img" aria-label="The engine thread runs the system, processes run code, services help" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>The engine thread runs the system, processes run code, services help</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker></defs><rect width="760" height="848" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">The engine thread runs the system, processes run code, services help</text><path d="M296 104V136" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M168 256V296" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M424 296V256" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M168 504V544" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M568 196H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M552 412H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M568 668H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Page main thread</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">launcher, input, createApp; starts the engine thread, the log keeper and the AudioWorklet</text><text x="304" y="124" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker</text><rect x="24" y="136" width="544" height="120" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="160" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Engine thread · the system</text><text x="40" y="176" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">system-wide Windows: process table, registry, files,</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">windows and focus, named objects</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">browser event loop: page messages, network, fetch, OPFS</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">scaling driver: hands cores to processes and services</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">runs no program code itself</text><text x="176" y="280" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">input, answers, translations</text><text x="432" y="280" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">cross-process calls</text><rect x="24" y="296" width="544" height="208" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="320" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Processes · one worker each</text><rect x="40" y="336" width="256" height="152" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="360" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Process A · x86</text><text x="56" y="376" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">own program memory</text><text x="56" y="392" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork runs its code</text><text x="56" y="408" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Win32: handles, heaps, windows</text><text x="56" y="424" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">records Direct3D and OpenGL calls</text><text x="56" y="440" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">never yields to the browser,</text><text x="56" y="456" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">waits on Atomics.wait when idle</text><text x="56" y="472" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">threads: 1..N executors</text><rect x="312" y="336" width="240" height="152" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="328" y="360" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Process B · x64</text><text x="328" y="376" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork-x64 runs its code</text><text x="328" y="392" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a launcher, an installer,</text><text x="328" y="408" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a second program</text><text x="328" y="424" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">runs at the same time as A</text><text x="328" y="472" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">today: only in turn with A</text><text x="176" y="528" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">regions, tasks, graphics calls</text><rect x="24" y="544" width="544" height="248" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="568" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Services · workers by load</text><rect x="40" y="584" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="608" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Translation ×M</text><text x="56" y="624" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">region → wasm module,</text><text x="56" y="640" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">the module goes to every process</text><text x="56" y="656" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">by load: 1..M</text><rect x="304" y="584" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="320" y="608" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Host work ×K</text><text x="320" y="624" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">zstd, video, JPEG, MP3,</text><text x="320" y="640" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">bundle block fetch</text><text x="320" y="656" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">by load: 0..K</text><rect x="40" y="688" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="712" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Graphics thread</text><text x="56" y="728" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">all graphics and the page’s</text><text x="56" y="744" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">canvas on its own WebGPU</text><text x="56" y="760" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">always 1</text><rect x="304" y="688" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="320" y="712" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Log and sound</text><text x="320" y="728" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">log keeper and AudioWorklet,</text><text x="320" y="744" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">started by the page</text><text x="320" y="760" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">always 1 each</text><rect x="584" y="136" width="152" height="656" rx="8" fill="#EEEDE8" stroke="#C4C2B8" stroke-width="1.25"/><text x="600" y="160" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Shared memory</text><text x="600" y="176" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">SharedArrayBuffer:</text><text x="600" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">process memory,</text><text x="600" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">message rings,</text><text x="600" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork tables</text><text x="24" y="824" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">Dashed: absent by default. Mode “1”: one process, one executor, translation ×1.</text></svg>
