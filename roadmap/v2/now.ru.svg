<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" role="img" aria-label="Код программы выполняется только в потоке движка" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Код программы выполняется только в потоке движка</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker></defs><rect width="760" height="512" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Код программы выполняется только в потоке движка</text><path d="M169 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M482 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M661 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M100 336V400" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M290 336V400" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M314 196H396" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M314 252H586" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Главный поток страницы</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">лаунчер, createApp, события DOM, опрос геймпадов</text><text x="177" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · postMessage</text><text x="490" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker</text><text x="669" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">addModule</text><rect x="24" y="152" width="290" height="184" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток движка</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork: интерпретаторы, сборка регионов,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">выполнение переведённого кода</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">потоки программы по очереди,</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">квант 100 000 инструкций</text><text x="40" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">память программы — обычная</text><text x="40" y="272" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Win32, планировщик, файлы,</text><text x="40" y="288" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">zstd, видео, MP3, микшер</text><text x="40" y="304" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Direct3D 10, Vulkan, DDraw, GDI,</text><text x="40" y="320" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">презентер → OffscreenCanvas</text><text x="355" y="188" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="middle">SAB: журнал</text><text x="450" y="244" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="middle">SAB: таблица голосов</text><rect x="396" y="152" width="180" height="72" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="412" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Хранитель журнала</text><text x="412" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">кадры, профиль,</text><text x="412" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">счётчики</text><rect x="586" y="152" width="150" height="120" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="602" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">AudioWorklet</text><text x="602" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">читает голоса</text><text x="602" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">по своим часам,</text><text x="602" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">сводит и играет</text><text x="108" y="364" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker</text><text x="108" y="380" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">вызовы и кадры</text><text x="298" y="364" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker из cork</text><text x="298" y="380" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">регионы и Module</text><rect x="24" y="400" width="152" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="424" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток графики</text><text x="40" y="440" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Direct3D 7, 8, 9</text><text x="40" y="456" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">и OpenGL рисует</text><text x="40" y="472" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">на своём WebGPU</text><rect x="200" y="400" width="180" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="216" y="424" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток трансляции</text><text x="216" y="440" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">регион → wasm-функция</text><text x="216" y="456" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">пакет → модуль</text><text x="216" y="472" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">компиляция</text></svg>
