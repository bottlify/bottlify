<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 848" width="760" height="848" role="img" aria-label="Поток движка управляет, процессы исполняют, службы помогают" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Поток движка управляет, процессы исполняют, службы помогают</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker></defs><rect width="760" height="848" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Поток движка управляет, процессы исполняют, службы помогают</text><path d="M296 104V136" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M168 256V296" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M424 296V256" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M168 504V544" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M568 196H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M552 412H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><path d="M568 668H584" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Главный поток страницы</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">лаунчер, ввод, createApp; создаёт поток движка, хранитель журнала и AudioWorklet</text><text x="304" y="124" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker</text><rect x="24" y="136" width="544" height="120" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="160" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток движка · система</text><text x="40" y="176" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">общая часть Windows: таблица процессов, реестр, файлы,</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">окна и фокус, именованные объекты</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">цикл событий браузера: сообщения страницы, сеть, fetch, OPFS</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">драйвер масштабирования: раздаёт ядра процессам и службам</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">код программ сам не исполняет</text><text x="176" y="280" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">ввод, ответы, переводы</text><text x="432" y="280" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">межпроцессные вызовы</text><rect x="24" y="296" width="544" height="208" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="320" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Процессы · каждый в своём воркере</text><rect x="40" y="336" width="256" height="152" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="360" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Процесс A · x86</text><text x="56" y="376" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">своя память программы</text><text x="56" y="392" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork исполняет её код</text><text x="56" y="408" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Win32 процесса: хэндлы, кучи, окна</text><text x="56" y="424" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">запись вызовов Direct3D и OpenGL</text><text x="56" y="440" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">браузеру управление не отдаёт,</text><text x="56" y="456" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">при простое ждёт на Atomics.wait</text><text x="56" y="472" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">потоки: 1..N исполнителей</text><rect x="312" y="336" width="240" height="152" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="328" y="360" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Процесс B · x64</text><text x="328" y="376" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork-x64 исполняет её код</text><text x="328" y="392" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">лаунчер, установщик,</text><text x="328" y="408" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">вторая программа</text><text x="328" y="424" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">работает одновременно с A</text><text x="328" y="472" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">сейчас: только по очереди с A</text><text x="176" y="528" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">регионы, задачи, вызовы графики</text><rect x="24" y="544" width="544" height="248" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="568" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Службы · воркеры по нагрузке</text><rect x="40" y="584" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="608" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Трансляция ×M</text><text x="56" y="624" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">регион → модуль wasm,</text><text x="56" y="640" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">модуль — всем процессам</text><text x="56" y="656" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">по нагрузке: 1..M</text><rect x="304" y="584" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25" stroke-dasharray="5 4"/><text x="320" y="608" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Работа хоста ×K</text><text x="320" y="624" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">zstd, видео, JPEG, MP3,</text><text x="320" y="640" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">загрузка блоков бандла</text><text x="320" y="656" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">по нагрузке: 0..K</text><rect x="40" y="688" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="56" y="712" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Поток графики</text><text x="56" y="728" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">вся графика и холст</text><text x="56" y="744" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">страницы на своём WebGPU</text><text x="56" y="760" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">всегда 1</text><rect x="304" y="688" width="248" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="320" y="712" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Журнал и звук</text><text x="320" y="728" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">хранитель журнала</text><text x="320" y="744" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">и AudioWorklet от страницы</text><text x="320" y="760" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">всегда по 1</text><rect x="584" y="136" width="152" height="656" rx="8" fill="#EEEDE8" stroke="#C4C2B8" stroke-width="1.25"/><text x="600" y="160" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Общая память</text><text x="600" y="176" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">SharedArrayBuffer:</text><text x="600" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">память процессов,</text><text x="600" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">кольца сообщений,</text><text x="600" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">таблицы cork</text><text x="24" y="824" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">Пунктиром — то, чего по умолчанию нет. Режим «1»: один процесс, один исполнитель, трансляция ×1.</text></svg>
