<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" role="img" aria-label="Program code runs on the engine thread alone" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Program code runs on the engine thread alone</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C2B8"/></marker></defs><rect width="760" height="512" rx="12" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Program code runs on the engine thread alone</text><path d="M169 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M482 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M661 104V152" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M100 336V400" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M290 336V400" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M314 196H396" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M314 252H586" fill="none" stroke="#C4C2B8" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="24" y="48" width="712" height="56" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Page main thread</text><text x="40" y="88" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">launcher, createApp, DOM events, gamepad polling</text><text x="177" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker · postMessage</text><text x="490" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker</text><text x="669" y="132" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">addModule</text><rect x="24" y="152" width="290" height="184" rx="8" fill="#2F6FD6" fill-opacity="0.10" stroke="#2F6FD6" stroke-width="2"/><text x="40" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Engine thread</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cork: interpreters, region forming,</text><text x="40" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">running translated code</text><text x="40" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">program threads in turn,</text><text x="40" y="240" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">a quantum of 100,000 instructions</text><text x="40" y="256" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">program memory: ordinary</text><text x="40" y="272" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Win32, scheduler, files,</text><text x="40" y="288" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">zstd, video, MP3, mixer</text><text x="40" y="304" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Direct3D 10, Vulkan, DDraw, GDI,</text><text x="40" y="320" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">presenter → OffscreenCanvas</text><text x="355" y="188" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="middle">SAB: journal</text><text x="450" y="244" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="middle">SAB: voice table</text><rect x="396" y="152" width="180" height="72" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="412" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Log keeper</text><text x="412" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">frames, profile,</text><text x="412" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">counters</text><rect x="586" y="152" width="150" height="120" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="602" y="176" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">AudioWorklet</text><text x="602" y="192" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">reads the voices</text><text x="602" y="208" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">on its own clock,</text><text x="602" y="224" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">mixes and plays</text><text x="108" y="364" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker</text><text x="108" y="380" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">calls and frames</text><text x="298" y="364" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">new Worker from cork</text><text x="298" y="380" font-size="11.5" font-weight="400" fill="#636C76" text-anchor="start">regions and Module</text><rect x="24" y="400" width="152" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="40" y="424" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Graphics thread</text><text x="40" y="440" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">Direct3D 7, 8, 9</text><text x="40" y="456" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">and OpenGL draw</text><text x="40" y="472" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">on its own WebGPU</text><rect x="200" y="400" width="180" height="88" rx="8" fill="none" stroke="#C4C2B8" stroke-width="1.25"/><text x="216" y="424" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Translation thread</text><text x="216" y="440" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">region → wasm function</text><text x="216" y="456" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">batch → module</text><text x="216" y="472" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">compilation</text></svg>
